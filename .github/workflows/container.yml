name: Container

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified version to GitHub Container Registry
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Version tag selected by the release workflow
        type: string
        required: true
      publish:
        type: boolean
        default: false

concurrency:
  group: container-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Build and exercise the distributed peer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JOCKI_IMAGE: jocki-ci:local
      JOCKI_TEST_URL: http://localhost:8080
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run sdk:verify
      - run: npm run typecheck
      - name: Check portable workspace CLI and folder storage
        run: npm run build:peer && npx tsx tests/workspace-cli.ts
      - name: Read image version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const {version} = JSON.parse(fs.readFileSync('package.json'));
          if (!/^\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(version)) throw Error('Invalid version');
          const revision = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version='+version+'\nrevision='+revision+'\n');
          NODE
      - name: Validate release version
        if: github.event_name == 'release' || inputs.ref != ''
        env:
          RELEASE_TAG: ${{ inputs.ref || github.event.release.tag_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: node -e "if(process.env.RELEASE_TAG!=='v'+process.env.PACKAGE_VERSION) throw Error('Release tag and package version differ')"
      - uses: docker/setup-buildx-action@v4
      - name: Build local image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: jocki-ci:local
          build-args: |
            JOCKI_VERSION=${{ steps.version.outputs.version }}
            SOURCE_REVISION=${{ steps.version.outputs.revision }}
          cache-from: type=gha,scope=jocki-client-amd64
          cache-to: type=gha,scope=jocki-client-amd64,mode=max
      - name: Start the peer
        run: docker run -d --name jocki-peer-ci -p 8080:8080 jocki-ci:local
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check startup, persistence and recovery
        run: node tests/browser/vault-start.mjs
      - name: Check history and task saves
        run: node tests/browser/history-tasks.mjs
      - name: Check forms, imports and templates
        run: |
          node tests/browser/csdb-forms-imports.mjs
          node tests/browser/workout-templates.mjs
      - name: Check data-view controls and recursive tasks
        run: |
          node tests/browser/csdb-data-view.mjs
          node tests/browser/task-tree-search.mjs
      - name: Check persistent identity after container replacement
        run: node tests/container.mjs
      - name: Stop the peer
        if: always()
        run: docker rm -f jocki-peer-ci

  publish:
    name: Publish verified amd64 and arm64 image
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
      - name: Set registry name
        id: registry
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'image=ghcr.io/'+process.env.GITHUB_REPOSITORY.toLowerCase()+'\n')"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.registry.outputs.image }}:${{ github.event_name == 'push' && inputs.ref == '' && 'edge' || needs.verify.outputs.version }}
            ${{ steps.registry.outputs.image }}:sha-${{ needs.verify.outputs.revision }}
          build-args: |
            JOCKI_VERSION=${{ needs.verify.outputs.version }}
            SOURCE_REVISION=${{ needs.verify.outputs.revision }}
          cache-from: type=gha,scope=jocki-client-amd64
          provenance: true
          sbom: true
