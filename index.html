<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#173f2b" />
    <link rel="icon" type="image/png" href="/jocki_icon.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Jocki</title>
    <style>
      body {
        margin: 0;
      }
      .initial-loading {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        color: #71717a;
      }
      .initial-loading svg {
        width: 48px;
        height: 48px;
        animation: initial-spin 1s linear infinite;
      }
      @keyframes initial-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .initial-loading svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        class="initial-loading"
        role="status"
        aria-label="Loading Jocki…"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10" stroke-dasharray="48 16" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
